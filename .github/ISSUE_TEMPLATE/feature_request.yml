name: Feature request
description: Suggest an improvement or new feature for Markdown Lens.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like Markdown Lens to support?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: How might this work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there simpler or different approaches?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy expectation
      options:
        - label: This feature can work fully in the browser without uploading Markdown content.
          required: true
